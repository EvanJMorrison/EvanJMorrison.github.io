# Section names below are NOT free-form. _layouts/cv.liquid looks for exact
# titles: Experience, Volunteer, Education, Publications, Skills, Languages,
# Interests, Certificates, Projects, References, Awards. Renaming one makes it
# fall through to a plain generic renderer -- or crash, in the case of
# Experience/Volunteer, which the template always merges together.
#
# LINES MARKED TODO ARE PLACEHOLDERS -- fill in before sharing the page.
# Entries marked [inferred] were reconstructed from your publication record.
# ---------------------------------------------------------------------------
