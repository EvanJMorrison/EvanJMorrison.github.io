name: Validate CV

on:
  push:
    branches: [main, master]
    paths:
      - "_data/cv.yml"
      - "_data/socials.yml"
      - "_pages/cv.md"
      - "assets/pdf/**"
      - "bin/validate-cv.py"
      - ".github/workflows/render-cv.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "_data/cv.yml"
      - "_data/socials.yml"
      - "_pages/cv.md"
      - "assets/pdf/**"
      - "bin/validate-cv.py"
      - ".github/workflows/render-cv.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cv:
    name: Validate uploaded CV and website data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 pypdf==6.10.0
      - name: Validate CV
        run: python bin/validate-cv.py
